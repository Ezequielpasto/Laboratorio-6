name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Verificar index.html
        run: test -f app/index.html

      - name: Crear ZIP
        run: zip -r sitio.zip app

      - name: Publicar artifact
        uses: actions/upload-artifact@v4
        with:
          name: sitio-web
          path: sitio.zip